{% extends "base.html" %}
{% block title %}art{% endblock title %}
{% block head %}
    {{ super() }}
    <script src="/static/gol.js" defer></script>
    <style>
        .art-masonry {
            display: flex;
            gap: 1rem;
        }

        .art-column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 1;
            min-width: 0;
        }

        .art-item {
            display: block;
            width: 100%;
            margin-bottom: 0;
            cursor: zoom-in;
            break-inside: avoid;
            background: transparent;
        }

        .art-item img {
            width: 100%;
            height: auto;
        }

        .art-lightbox {
            display: grid;
            place-items: center;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            border: 0;
            background: transparent;
            outline: none;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.96);
            transition:
                opacity 180ms ease,
                transform 180ms ease,
                visibility 180ms ease;
        }

        .art-lightbox[open] {
            display: grid;
            place-items: center;
        }

        .art-lightbox.is-open {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .art-lightbox::backdrop {
            background: transparent;
            transition: background 180ms ease;
        }

        .art-lightbox.is-open::backdrop {
            background: rgb(0 0 0 / 0.82);
        }

        .art-lightbox img {
            max-width: 96vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            cursor: zoom-out;
            opacity: 0;
            transform: scale(0.98);
            transition:
                opacity 180ms ease,
                transform 180ms ease;
        }

        .art-lightbox img.is-loaded {
            opacity: 1;
            transform: scale(1);
        }

        .art-lightbox-close {
            position: fixed;
            top: 1rem;
            right: 1rem;
            color: white;
            cursor: pointer;
            background: rgb(0 0 0 / 0.55);
            padding: 0.5rem 0.75rem;
        }

        #art-order:focus,
        #art-order:focus-visible {
            outline: none;
            box-shadow: none;
        }
    </style>
{% endblock head %}
{% block meta %}
    <meta property="og:title" content="nam's art" />
    <meta property="og:url" content="https://namishh.me/art" />
    <meta property="og:image" content="/og/web/art.png" />
    <meta name="twitter:card" content="summary_large_image">
    <meta property="og:type" content="article" />
    <meta property="og:description" content="all the art that i have made">


    <meta property="twitter:description" content="all the art that i have made">
    <meta name="twitter:title" content="nam's art">
    <meta property="twitter:image" content="/og/web/stuff.png" />
{% endblock meta %}
{% block content %}

<h2 class="mb-4 text-normal">drawing since 8th feb 2026. digitally since 21st may 2026</h2>

<div class="mb-4">
    <select id="art-order" class="bg-neutral-100 dark:bg-neutral-950 border border-neutral-300 dark:border-neutral-800 px-2 py-2 text-sm">
        <option value="desc">newest first</option>
        <option value="asc">oldest first</option>
    </select>
</div>

<div class="art-masonry" id="art-masonry"></div>

<dialog class="art-lightbox" id="art-lightbox" aria-label="Expanded artwork">
    <button class="art-lightbox-close" type="button">close</button>
    <img id="art-lightbox-image" src="" alt="">
</dialog>

<script>
    // single source of truth for ordering — cycling and layout both read from this
    const artworks = [
        { src: "/static/images/0001-gestures.webp", alt: "gestures drawing" },
        { src: "/static/images/0002-gestures-2.webp", alt: "gestures 2 drawing" },
        { src: "/static/images/0004-umas.webp", alt: "umas drawing" },
        { src: "/static/images/0005-anime-faces-2.webp", alt: "anime faces 2 drawing" },
        { src: "/static/images/0006-boys.webp", alt: "boys drawing" },
        { src: "/static/images/0008-knight.webp", alt: "knight drawing" },
        { src: "/static/images/0010-hands.webp", alt: "hands drawing" },
        { src: "/static/images/0011-hands-2.webp", alt: "hands 2 drawing" },
        { src: "/static/images/0012-hands-3.webp", alt: "hands 3 drawing" },
        { src: "/static/images/0014-face-parts.webp", alt: "face parts drawing" },
        { src: "/static/images/0017-asaro.webp", alt: "asaro heads" },
        { src: "/static/images/0015-garmond.webp", alt: "garmond" },
        { src: "/static/images/0018-bust.webp", alt: "head" },
        { src: "/static/images/0019-virgin-mary.webp", alt: "virgin mary" },
        { src: "/static/images/0021-pattison.webp", alt: "pat" },
        { src: "/static/images/0022-nobara.webp", alt: "nobara" },
        { src: "/static/images/0023-anime-girls.webp", alt: "anime gals" },
        { src: "/static/images/0023-values-1.webp", alt: "value paintings 1" },
        { src: "/static/images/0024-values-2.webp", alt: "value paintings 1" },
        { src: "/static/images/0025-arms.webp", alt: "arms" },
        { src: "/static/images/0026-makima.webp", alt: "makima" },
        { src: "/static/images/0027-fern.webp", alt: "fern" },
        { src: "/static/images/0028-sculptures.webp", alt: "sculptures" },
        { src: "/static/images/0029-rendering.webp", alt: "rendering" },
        { src: "/static/images/0030-frieren.webp", alt: "freeran" },
        { src: "/static/images/0031-mink.webp", alt: "mink challenge" },
        { src: "/static/images/0032-manatee.webp", alt: "manatee" },
    ];

    const container = document.getElementById("art-masonry");
    const orderSelect = document.getElementById("art-order");
    const lightbox = document.getElementById("art-lightbox");
    const lightboxImage = document.getElementById("art-lightbox-image");
    let closeTimer;
    let currentIndex = -1;
    let currentCols = 0;
    let currentList = artworks;

    function getColCount() {
        if (window.matchMedia("(min-width: 1280px)").matches) return 3;
        if (window.matchMedia("(min-width: 640px)").matches) return 2;
        return 1;
    }

    function render(force = false) {
        const cols = getColCount();
        if (!force && cols === currentCols) return; // avoid rebuilding on zoom/no-op resizes
        currentCols = cols;

        currentList = orderSelect.value === "desc" ? [...artworks].reverse() : artworks;

        container.innerHTML = "";
        const columns = Array.from({ length: cols }, () => {
            const col = document.createElement("div");
            col.className = "art-column";
            container.appendChild(col);
            return col;
        });

        currentList.forEach((art, index) => {
            const button = document.createElement("button");
            button.className = "art-item";
            button.type = "button";
            button.setAttribute("aria-label", `Open ${art.alt}`);

            const img = document.createElement("img");
            img.src = art.src;
            img.alt = art.alt;

            button.appendChild(img);
            button.addEventListener("click", () => openLightboxAt(index));

            columns[index % cols].appendChild(button);
        });
    }

    async function openLightboxAt(index) {
        if (index < 0 || index >= currentList.length) return;
        currentIndex = index;
        const art = currentList[index];

        window.clearTimeout(closeTimer);
        lightbox.classList.remove("is-open");
        lightboxImage.classList.remove("is-loaded");
        lightboxImage.removeAttribute("src");

        const nextImage = new Image();
        nextImage.src = art.src;
        nextImage.alt = art.alt;

        if (nextImage.decode) {
            await nextImage.decode().catch(() => {});
        }

        lightboxImage.alt = art.alt;
        lightboxImage.src = art.src;
        if (!lightbox.open) lightbox.showModal();
        document.documentElement.style.overflow = "hidden";

        requestAnimationFrame(() => {
            lightbox.classList.add("is-open");
            lightboxImage.classList.add("is-loaded");
        });
    }

    function closeLightbox() {
        lightbox.classList.remove("is-open");
        lightboxImage.classList.remove("is-loaded");
        window.clearTimeout(closeTimer);
        closeTimer = window.setTimeout(() => {
            lightbox.close();
            document.documentElement.style.overflow = "";
        }, 180);
    }

    render(true);

    // matchMedia listeners fire only on actual breakpoint crossings,
    // unlike "resize" which fires repeatedly during pinch/ctrl-zoom
    ["(min-width: 640px)", "(min-width: 1280px)"].forEach((query) => {
        window.matchMedia(query).addEventListener("change", () => render());
    });

    orderSelect.addEventListener("change", () => render(true));

    document.addEventListener("keydown", (event) => {
        if (!lightbox.open) return;
        if (event.key === "ArrowRight") {
            openLightboxAt((currentIndex + 1) % currentList.length);
        } else if (event.key === "ArrowLeft") {
            openLightboxAt((currentIndex - 1 + currentList.length) % currentList.length);
        }
    });

    lightbox.addEventListener("close", () => {
        lightbox.classList.remove("is-open");
        lightboxImage.classList.remove("is-loaded");
        lightboxImage.removeAttribute("src");
        lightboxImage.alt = "";
        currentIndex = -1;
        document.documentElement.style.overflow = "";
    });

    lightbox.addEventListener("cancel", (event) => {
        event.preventDefault();
        closeLightbox();
    });

    lightbox.addEventListener("click", (event) => {
        if (
            event.target === lightbox ||
            event.target.classList.contains("art-lightbox-close") ||
            event.target === lightboxImage
        ) {
            closeLightbox();
        }
    });
</script>

{% endblock content %}
